<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smartphone-Simulator · World Revolution Atlas</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --phone-width: 393px;
      --phone-height: 852px;
      --phone-radius: 54px;
      --accent: #ff7a45;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: #f7f2ea;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 91, 73, .22), transparent 34%),
        radial-gradient(circle at 84% 78%, rgba(255, 190, 80, .14), transparent 30%),
        linear-gradient(145deg, #18130f, #090909 60%, #15100d);
    }

    .simulator {
      display: grid;
      grid-template-columns: minmax(250px, 340px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .controls {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 32px;
      border-right: 1px solid rgba(255,255,255,.09);
      background: rgba(13, 12, 11, .76);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0;
      color: #eebc87;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: .96;
      letter-spacing: -.04em;
    }

    .explanation {
      margin: 0;
      color: #c9c1b7;
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 8px;
      color: #e3d9cd;
      font-size: 13px;
      font-weight: 700;
    }

    select, button {
      min-height: 46px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      color: #fff8ef;
      background: #24201c;
      font: inherit;
    }

    select { padding: 0 14px; font-size: 16px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 750;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 152, 99, .62);
      background: #302720;
    }

    button:active { transform: translateY(1px); }

    button:focus-visible, select:focus-visible {
      outline: 3px solid rgba(255, 122, 69, .55);
      outline-offset: 2px;
    }

    .status {
      margin-top: auto;
      color: #a99e91;
      font-size: 12px;
      line-height: 1.5;
    }

    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 100vh;
      padding: 30px;
      overflow: auto;
    }

    .phone-wrap {
      position: relative;
      width: calc(var(--phone-width) + 28px);
      height: calc(var(--phone-height) + 28px);
      flex: none;
      transition: width .25s ease, height .25s ease;
    }

    .phone {
      position: absolute;
      inset: 0;
      padding: 14px;
      border: 1px solid #5d5851;
      border-radius: calc(var(--phone-radius) + 12px);
      background: linear-gradient(135deg, #716b63 0%, #151515 8%, #050505 53%, #56504a 100%);
      box-shadow:
        0 45px 100px rgba(0,0,0,.58),
        0 0 0 2px #050505,
        inset 0 0 0 1px rgba(255,255,255,.18);
    }

    .screen {
      position: relative;
      width: var(--phone-width);
      height: var(--phone-height);
      overflow: hidden;
      border-radius: var(--phone-radius);
      background: #000;
      transition: width .25s ease, height .25s ease, border-radius .25s ease;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #111;
    }

    .island {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      width: 116px;
      height: 34px;
      border-radius: 999px;
      background: #030303;
      box-shadow: 0 1px 2px rgba(255,255,255,.08);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .home-indicator {
      position: absolute;
      z-index: 4;
      bottom: 7px;
      left: 50%;
      width: 124px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 0 2px rgba(0,0,0,.4);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .side-button {
      position: absolute;
      right: -5px;
      top: 155px;
      width: 5px;
      height: 92px;
      border-radius: 0 4px 4px 0;
      background: #393530;
    }

    .volume {
      position: absolute;
      left: -5px;
      top: 132px;
      width: 5px;
      height: 116px;
      border-radius: 4px 0 0 4px;
      background: linear-gradient(#393530 0 40%, transparent 40% 52%, #393530 52%);
    }

    body.landscape .phone-wrap {
      width: calc(var(--phone-height) + 28px);
      height: calc(var(--phone-width) + 28px);
    }

    body.landscape .screen {
      width: var(--phone-height);
      height: var(--phone-width);
    }

    body.landscape .island {
      top: 50%;
      left: 12px;
      width: 34px;
      height: 116px;
      transform: translateY(-50%);
    }

    body.landscape .home-indicator {
      inset: 50% 7px auto auto;
      width: 5px;
      height: 124px;
      transform: translateY(-50%);
    }

    body.classic-device .island { display: none; }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .simulator { grid-template-columns: 1fr; }
      .controls { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.09); }
      .controls { padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 20px max(20px, env(safe-area-inset-left)); }
      .stage { min-height: auto; padding: 18px; justify-content: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="simulator">
    <section class="controls" aria-labelledby="simulator-title">
      <p class="eyebrow">Lokale Testumgebung</p>
      <h1 id="simulator-title">Smartphone-Simulator</h1>
      <p class="explanation">Die Karte läuft innerhalb eines echten mobilen Bildschirmformats. Maus und Trackpad entsprechen Fingertipps und Wischgesten.</p>

      <label for="device">
        Gerät
        <select id="device">
          <option value="393,852,54">iPhone 15 · 393 × 852</option>
          <option value="320,568,22,se">iPhone SE · 320 × 568</option>
          <option value="412,915,42">Pixel 8 · 412 × 915</option>
          <option value="360,800,38">Kompaktes Android · 360 × 800</option>
        </select>
      </label>

      <div class="actions">
        <button id="rotate" type="button">↻ Drehen</button>
        <button id="reload" type="button">Neu laden</button>
      </div>

      <p class="status" id="status" aria-live="polite">iPhone 15 · Hochformat · 393 × 852</p>
    </section>

    <section class="stage" aria-label="Simuliertes Smartphone">
      <div class="phone-wrap">
        <div class="phone">
          <span class="volume" aria-hidden="true"></span>
          <span class="side-button" aria-hidden="true"></span>
          <div class="screen">
            <span class="island" aria-hidden="true"></span>
            <iframe id="app" src="./?simulatedMobile=1" title="World Revolution Atlas in der Smartphone-Ansicht"></iframe>
            <span class="home-indicator" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const device = document.querySelector('#device');
    const app = document.querySelector('#app');
    const status = document.querySelector('#status');
    let landscape = false;

    function applyDevice() {
      const [widthValue, heightValue, radiusValue, deviceKind = 'modern'] = device.value.split(',');
      const [width, height, radius] = [widthValue, heightValue, radiusValue].map(Number);
      document.body.classList.toggle('classic-device', deviceKind === 'se');
      document.documentElement.style.setProperty('--phone-width', `${width}px`);
      document.documentElement.style.setProperty('--phone-height', `${height}px`);
      document.documentElement.style.setProperty('--phone-radius', `${radius}px`);
      const label = device.options[device.selectedIndex].text.split(' · ')[0];
      const dimensions = landscape ? `${height} × ${width}` : `${width} × ${height}`;
      status.textContent = `${label} · ${landscape ? 'Querformat' : 'Hochformat'} · ${dimensions}`;
    }

    device.addEventListener('change', applyDevice);
    document.querySelector('#rotate').addEventListener('click', () => {
      landscape = !landscape;
      document.body.classList.toggle('landscape', landscape);
      applyDevice();
    });
    document.querySelector('#reload').addEventListener('click', () => {
      app.contentWindow.location.reload();
    });
  </script>
</body>
</html>
