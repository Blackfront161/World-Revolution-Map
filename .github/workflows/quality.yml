name: Atlas quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: UTF-8, controls and JSON parsing
        run: npm run check:encoding
      - name: JavaScript syntax
        run: npm run check:js
      - name: Data model and source URL validation
        run: npm run validate:data
      - name: Translation inventory and no-regression baseline
        run: npm run check:translations
      - name: Context-sensitive German inclusive-language gate
        run: npm run check:inclusive-language
      - name: Test suite
        run: npm test
      - name: Remote source availability
        run: npm run check:sources
